name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-monitor:
    runs-on: ubuntu-latest
    env:
      CREDIT_PII_SALT: ${{ secrets.CREDIT_PII_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (data contracts, drift statistics, alert rules)
        run: pytest -q
      - name: Full sustainment pipeline
        run: python -m src.pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: |
            reports/
            logs/pipeline.jsonl
