name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Prometheus alert rules
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/rules" -w /rules
          --entrypoint promtool prom/prometheus:v2.55.1 check rules alerts.yml
      - name: Unit-test alert rules (promtool)
        run: >
          docker run --rm -v "$PWD/monitoring/prometheus:/rules" -w /rules
          --entrypoint promtool prom/prometheus:v2.55.1 test rules alerts_test.yml
      - name: Grafana dashboard is in sync with its generator
        run: |
          python monitoring/grafana/generate_dashboard.py
          git diff --exit-code monitoring/grafana/dashboards/sentrix.json

  test-and-monitor:
    runs-on: ubuntu-latest
    env:
      CREDIT_PII_SALT: ${{ secrets.CREDIT_PII_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (data contracts, drift statistics, alert rules)
        run: pytest -q
      - name: Full sustainment pipeline
        run: python -m src.pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: |
            reports/
            logs/pipeline.jsonl
