name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly monitoring run (1st day, 06:00 UTC) — emulates the monthly production batch.
    - cron: "0 6 1 * *"

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint + format check
        run: make lint

  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unit-test Prometheus alert rules (promtool)
        run: make promtool
      - name: Grafana dashboard is in sync with its generator
        run: |
          make dashboard
          git diff --exit-code monitoring/grafana/dashboards/sentrix.json

  test-and-monitor:
    needs: [lint, alert-rules]
    runs-on: ubuntu-latest
    env:
      CREDIT_PII_SALT: ${{ secrets.CREDIT_PII_SALT }}
      SENTRIX_VIDEO_URL: ${{ vars.SENTRIX_VIDEO_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: make install
      - name: Unit and integration tests (contracts, drift, alert metrics)
        run: make test
      - name: Full sustainment pipeline (no Pushgateway in CI)
        run: make pipeline PUSHGATEWAY=
      - name: Build project portal
        run: make site
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: |
            reports/
            logs/pipeline.jsonl
      - name: Upload portal for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # CD: publish the portal (dashboard + Evidently reports) on every main build and monthly run.
  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-monitor
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
