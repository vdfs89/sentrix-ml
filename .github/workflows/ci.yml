name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint + format check
        run: make lint

  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unit-test Prometheus alert rules (promtool)
        run: make promtool
      - name: Grafana dashboard is in sync with its generator
        run: |
          make dashboard
          git diff --exit-code monitoring/grafana/dashboards/sentrix.json

  test-and-monitor:
    needs: [lint, alert-rules]
    runs-on: ubuntu-latest
    env:
      CREDIT_PII_SALT: ${{ secrets.CREDIT_PII_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: make install
      - name: Unit and integration tests (contracts, drift, alert metrics)
        run: make test
      - name: Full sustainment pipeline (no Pushgateway in CI)
        run: make pipeline PUSHGATEWAY=
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-reports
          path: |
            reports/
            logs/pipeline.jsonl
