[project]
name = "sentrix-ml"
version = "1.5.0"
description = "SENTRIX — Continuous ML Observability & Governance for Credit Risk"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [".venv", "data", "mlartifacts", "reports", "logs", "site"]

[tool.ruff.lint]
# E/W pycodestyle · F pyflakes · I isort · B bugbear · UP pyupgrade · SIM simplify · N naming
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML/CSS template of the static dashboard: long lines are markup, not logic.
"src/dashboard.py" = ["E501"]
"src/portal.py" = ["E501"]
